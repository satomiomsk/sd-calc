name: Test developer password

on:
  push:
    branches:
      - main
    paths:
      - "lib/auth.ts"
      - "tests/auth.test.cjs"
      - "package.json"
      - ".github/workflows/test-developer-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test developer password and signed sessions
        run: node --test tests/auth.test.cjs
