name: Test developer password

on:
  push:
    branches:
      - main
    paths:
      - "lib/auth.ts"
      - "tests/auth.test.cjs"
      - ".github/workflows/test-developer-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript test runner
        run: npm install --prefix /tmp/auth-test --ignore-scripts typescript@5.9.3
      - name: Test developer password and signed sessions
        env:
          NODE_PATH: /tmp/auth-test/node_modules
        run: node --test tests/auth.test.cjs
