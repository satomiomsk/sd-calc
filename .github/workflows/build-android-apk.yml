name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [reduce-supabase-traffic]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build static website
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Apply SD Calculator launcher and installer icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Image.open("public/icons/sd-512.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # Adaptive icon artwork stays inside Android's safe zone.
          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          artwork = source.copy()
          artwork.thumbnail((288, 288), Image.Resampling.LANCZOS)
          foreground.alpha_composite(artwork, ((432 - artwork.width) // 2, (432 - artwork.height) // 2))
          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          foreground.save(drawable / "ic_launcher_foreground.png")

          adaptive = Path("android/app/src/main/res/mipmap-anydpi-v26")
          adaptive.mkdir(parents=True, exist_ok=True)
          for name in ("ic_launcher", "ic_launcher_round"):
              (adaptive / f"{name}.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ''')

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          ns = "{http://schemas.android.com/apk/res/android}"
          application.set(ns + "icon", "@mipmap/ic_launcher")
          application.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY

      - name: Copy static website into Android app
        run: npx cap sync android

      - name: Configure optimized release APK
        working-directory: android
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle")
          text = path.read_text()
          release = """
          android {
              buildTypes {
                  release {
                      // Signed with the standard debug key so the APK can be installed directly.
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          """
          if "buildTypes {" not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit("Could not find dependencies block in app/build.gradle")
              text = text.replace(marker, release + "\\n" + marker, 1)
          # Configure signing separately so it also applies when the Capacitor template
          # already contains a buildTypes block.
          text += """
          
          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          """
          path.write_text(text)
          PY

      - name: Build optimized installable release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK launcher icon
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$aapt"
          badging=$("$aapt" dump badging "$apk")
          echo "$badging" | grep -E '^application-icon(-[0-9]+)?:' || { echo "APK manifest does not expose launcher icon resources"; exit 1; }
          echo "Verified launcher icon is referenced by the APK manifest"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sd-calculator-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
