name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [reduce-supabase-traffic]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build static website
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Apply SD Calculator launcher icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("public/icons/sd-512.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")
          # Adaptive launcher icon foreground; keep the supplied square artwork intact.
          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          source.resize((432, 432), Image.Resampling.LANCZOS).save(drawable / "ic_launcher_foreground.png")
          adaptive = Path("android/app/src/main/res/mipmap-anydpi-v26")
          adaptive.mkdir(parents=True, exist_ok=True)
          for name in ("ic_launcher", "ic_launcher_round"):
              (adaptive / f"{name}.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ''')
          PY

      - name: Copy static website into Android app
        run: npx cap sync android

      - name: Configure optimized release APK
        working-directory: android
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle")
          text = path.read_text()
          release = """
          android {
              buildTypes {
                  release {
                      // Signed with the standard debug key so the APK can be installed directly.
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          """
          if "buildTypes {" not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit("Could not find dependencies block in app/build.gradle")
              text = text.replace(marker, release + "\\n" + marker, 1)
          import re
          text, version_name_count = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.0"', text, count=1)
          text, version_code_count = re.subn(r'versionCode\s+\d+', 'versionCode 1', text, count=1)
          if version_name_count != 1 or version_code_count != 1:
              raise SystemExit("Could not set Android versionName/versionCode")
          path.write_text(text)
          PY

      - name: Build optimized installable release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sd-calculator-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
