name: Verify static site build

on:
  pull_request:
    branches: [main]
  push:
    branches: [reduce-supabase-traffic]

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static site
        run: npm run build
      - name: Confirm static output exists
        run: test -f out/index.html
