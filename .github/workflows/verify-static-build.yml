name: Verify static site build

on:
  pull_request:
    branches: [main]
  push:
    branches: [reduce-supabase-traffic]

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run calculation tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Build static site
        run: npm run build

      - name: Confirm static output exists
        run: test -f out/index.html

      - name: Package static site
        run: |
          cd out
          zip -r ../sd-calculator-static-site.zip .

      - name: Upload static site archive
        uses: actions/upload-artifact@v4
        with:
          name: sd-calculator-static-site
          path: sd-calculator-static-site.zip
          if-no-files-found: error
          retention-days: 30
