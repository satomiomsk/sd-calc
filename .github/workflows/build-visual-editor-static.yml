name: Build static visual editor preview

on:
  workflow_dispatch:
  push:
    branches:
      - visual-editor-preview
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/build-visual-editor-static.yml"

permissions:
  contents: read

jobs:
  build-static-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual editor branch
        uses: actions/checkout@v4
        with:
          ref: visual-editor-preview

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare a static-only preview build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("next.config.mjs")
          source = config.read_text()
          source = source.replace(
              "output: 'standalone',",
              "output: 'export',\n  basePath: '/sd-calculator-supabase',\n  trailingSlash: true,"
          )
          config.write_text(source)

          tariffs = Path("hooks/use-tariffs.ts")
          tariffs.write_text("""\"use client\";
          import { DEFAULT_TARIFFS, type TariffSnapshot } from '@/lib/tariffs';
          export const TARIFF_ORIGIN = '';
          export function useTariffs() {
            return { tariffs: DEFAULT_TARIFFS as TariffSnapshot, status: 'Встроенные условия' };
          }
          """)

          layout = Path("app/layout.tsx")
          text = layout.read_text()
          text = "\n".join(
              line for line in text.splitlines()
              if 'import { AppAnalytics }' not in line and '<AppAnalytics />' not in line
          ) + "\\n"
          layout.write_text(text)

          homepage = Path("app/page.tsx")
          text = homepage.read_text()
          text = text.replace(': "/developer";', ': "/sd-calculator-supabase/";')
          homepage.write_text(text)
          PY
          rm -rf app/api app/developer

      - name: Build static website preview
        env:
          NEXT_PUBLIC_BASE_PATH: /sd-calculator-supabase
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build-static-preview
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
